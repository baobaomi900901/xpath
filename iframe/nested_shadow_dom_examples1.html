<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nested Shadow DOM — 4 层示例</title>
</head>
<body>
  <h1>Nested Shadow DOM 示例（4 层）</h1>

  <!-- 根自定义元素，作为第一层容器 -->
  <layer-one></layer-one>

  <script>
    /* --------------------------
       Layer 1: 包含一个表单（open shadow root）
       提交表单会向下传递自定义事件，更新表格数据（Layer 2）
       -------------------------- */
    class LayerOne extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
      }
      connectedCallback() {
        const s = this.shadowRoot;
        s.innerHTML = `
          <style>
            :host { display: block; font-family: system-ui,Segoe UI,Roboto,Arial; padding: 14px; border: 2px solid #7aa; border-radius: 8px; }
            h2 { margin: 0 0 8px 0; font-size: 1.1rem; color: #0b5566; }
            form { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
            input[type="text"] { padding:6px 8px; border-radius:6px; border:1px solid #ccc; }
            button { padding:6px 10px; border-radius:6px; border:none; background:#0b5566; color:white; cursor:pointer; }
            .hint { font-size:0.85rem; color:#666; margin-top:8px; }
            .inner { margin-top:12px; padding:10px; background: #f7fffe; border-radius:6px; }
          </style>

          <h2>Layer 1 — 表单（提交新增行）</h2>
          <form id="addForm">
            <label>
              名称:
              <input type="text" name="name" placeholder="例如：项目 A" required />
            </label>
            <label>
              数值:
              <input type="text" name="value" placeholder="例如：42" required pattern="\\d+" title="请输入整数" />
            </label>
            <button type="submit">添加</button>
          </form>
          <div class="hint">提交表单会触发事件，通知下层表格新增一行。</div>
          <div class="inner">
            <!-- 在 layer1 内嵌入 layer-two 元素（Layer 2）-->
            <layer-two></layer-two>
          </div>
        `;

        const form = s.getElementById('addForm');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(form);
          const payload = { name: fd.get('name'), value: Number(fd.get('value')) || 0, id: Date.now() };
          // 通过自定义事件向下派发（bubbles: true 使其可穿过 shadow boundary）
          this.dispatchEvent(new CustomEvent('add-row', { detail: payload, bubbles: true, composed: true }));
          form.reset();
        });
      }
    }
    customElements.define('layer-one', LayerOne);

    /* --------------------------
       Layer 2: 表格（open shadow root）
       接收 add-row 事件并在表格中新增行。点击行会打开 layer-three 并传数据。
       -------------------------- */
    class LayerTwo extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this._data = [
          { id: 1, name: '示例项 1', value: 10 },
          { id: 2, name: '示例项 2', value: 25 },
          { id: 3, name: '示例项 2', value: 25 },
          { id: 4, name: '示例项 2', value: 25 },
          { id: 5, name: '示例项 2', value: 25 },
          { id: 6, name: '示例项 2', value: 25 },
          { id: 7, name: '示例项 2', value: 25 },
          { id: 8, name: '示例项 2', value: 25 },
          { id: 9, name: '示例项 2', value: 25 },
          { id: 10, name: '示例项 2', value: 25 },
          { id: 11, name: '示例项 2', value: 25 },
          { id: 12, name: '示例项 2', value: 25 },
        ];
      }
      connectedCallback() {
        const s = this.shadowRoot;
        s.innerHTML = `
          <style>
            :host { display:block; margin-top:10px; }
            table { width:100%; border-collapse:collapse; }
            th, td { padding:8px 6px; border-bottom:1px solid #ddd; text-align:left; }
            tr:hover { background: #f0f9f9; cursor:pointer; }
            th { background:#e6f7f7; }
            .wrap { border:1px solid #cde; padding:8px; border-radius:6px; }
            .controls { margin-top:8px; display:flex; gap:8px; align-items:center; }
            .btn { padding:6px 8px; border-radius:6px; border:none; background:#0b5577; color:white; cursor:pointer; }
          </style>

          <div class="wrap">
            <div style="font-weight:600; margin-bottom:8px;">Layer 2 — 数据表格（点击行查看详情）</div>
            <table id="dataTable" aria-label="数据表">
              <thead><tr><th>名称</th><th>数值</th></tr></thead>
              <tbody></tbody>
            </table>
            <div class="controls">
              <button id="sumBtn" class="btn">计算总和并通知下层</button>
              <span id="sumRes"></span>
            </div>

            <div style="margin-top:10px;">
              <!-- 嵌入 layer-three（Layer 3）-->
              <layer-three></layer-three>
            </div>
          </div>
        `;
        this.tbody = s.querySelector('tbody');
        this.sumRes = s.getElementById('sumRes');
        this.renderTable();

        // 监听来自 Layer 1 的新增行事件（事件穿越了 shadow boundary）
        this.addEventListener('add-row', (ev) => {
          this._data.push(ev.detail);
          this.renderTable();
        });

        // 点击行，向 layer-three 发送 show-item 事件（composed: true）
        this.tbody.addEventListener('click', (ev) => {
          const tr = ev.target.closest('tr');
          if (!tr) return;
          const id = Number(tr.dataset.id);
          const item = this._data.find(x => x.id === id);
          if (item) {
            this.dispatchEvent(new CustomEvent('show-item', { detail: item, bubbles: true, composed: true }));
          }
        });

        // 计算总和并向下层（layer-three）发事件
        s.getElementById('sumBtn').addEventListener('click', () => {
          const total = this._data.reduce((a,b) => a + Number(b.value || 0), 0);
          this.sumRes.textContent = `总和: ${total}`;
          this.dispatchEvent(new CustomEvent('total-updated', { detail: { total }, bubbles: true, composed: true }));
        });
      }

      renderTable() {
        this.tbody.innerHTML = this._data.map(row => `<tr data-id="${row.id}"><td>${escapeHtml(row.name)}</td><td>${escapeHtml(String(row.value))}</td></tr>`).join('');
      }
    }
    customElements.define('layer-two', LayerTwo);

    /* 简单的 HTML 转义 */
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    /* --------------------------
       Layer 3: 折叠卡片 / 列表（open shadow root）
       监听 show-item 和 total-updated 事件。每次 show-item 会把数据传到 layer-four。
       -------------------------- */
    class LayerThree extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
      }
      connectedCallback() {
        const s = this.shadowRoot;
        s.innerHTML = `
          <style>
            :host { display:block; margin-top:12px; }
            .card { border:1px solid #ddd; padding:10px; border-radius:8px; background:white; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
            .title { font-weight:600; margin-bottom:8px; color:#0b4b5a; }
            .details { font-size:0.95rem; color:#333; }
            .badge { display:inline-block; padding:4px 8px; border-radius:999px; background:#e8f6f6; margin-left:8px; font-weight:600; color:#076; }
            .row { margin:8px 0; }
            .toggle { cursor:pointer; color:#0a6; text-decoration:underline; background:none; border:none; padding:0; }
          </style>

          <div class="card">
            <div class="title">Layer 3 — 折叠卡片 / 详情面板 <span id="totalBadge" class="badge">总和: -</span></div>
            <div id="content" class="details">点击表格中的一行查看详情。</div>

            <div style="margin-top:10px;">
              <!-- 嵌入 layer-four（Layer 4）-->
              <layer-four></layer-four>
            </div>
          </div>
        `;

        // 监听表格发来的 show-item 事件（从上层穿过）
        this.addEventListener('show-item', (ev) => {
          const item = ev.detail;
          this.shadowRoot.getElementById('content').innerHTML = `
            <div class="row"><strong>名称：</strong> ${escapeHtml(item.name)}</div>
            <div class="row"><strong>数值：</strong> ${escapeHtml(String(item.value))}</div>
            <div class="row"><button id="sendToChart" class="toggle">把这个数值发送到图表（下层）</button></div>
          `;
          this.shadowRoot.getElementById('sendToChart').addEventListener('click', () => {
            // 向下层发送 custom event，把单条数据发给 layer-four
            this.dispatchEvent(new CustomEvent('chart-data', { detail: { label: item.name, value: Number(item.value) }, bubbles: true, composed: true }));
          });
        });

        // 监听 total-updated 事件来更新徽章
        this.addEventListener('total-updated', (ev) => {
          const totalBadge = this.shadowRoot.getElementById('totalBadge');
          totalBadge.textContent = `总和: ${ev.detail.total}`;
        });
      }
    }
    customElements.define('layer-three', LayerThree);

    /* --------------------------
       Layer 4: Canvas 小图表（open shadow root）
       负责接收 chart-data 事件并更新绘制（简单条形图）
       -------------------------- */
    class LayerFour extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this._dataset = []; // {label, value}
      }
      connectedCallback() {
        const s = this.shadowRoot;
        s.innerHTML = `
          <style>
            :host { display:block; margin-top:10px; }
            .panel { border:1px dashed #cfe; padding:8px; border-radius:6px; background:#fbffff; }
            .title { font-weight:600; margin-bottom:6px; color:#0b5666; }
            canvas { display:block; width:100%; height:140px; border-radius:6px; background:linear-gradient(#fff, #f7fdfd); }
            .hint { font-size:0.85rem; color:#666; margin-top:6px; }
          </style>
          <div class="panel">
            <div class="title">Layer 4 — 简单条形图（Canvas）</div>
            <canvas id="chart" width="600" height="140" role="img" aria-label="示例条形图"></canvas>
            <div class="hint">点击 Layer 3 的“把这个数值发送到图表”来添加数据点。</div>
          </div>
        `;
        this.canvas = s.getElementById('chart');
        this.ctx = this.canvas.getContext('2d');
        this.draw(); // 初始绘制（空图）

        // 监听来自上层的 chart-data 事件
        this.addEventListener('chart-data', (ev) => {
          const { label, value } = ev.detail;
          // 添加数据（若 label 已存在，则累加）
          const found = this._dataset.find(d => d.label === label);
          if (found) found.value += value;
          else this._dataset.push({ label, value });
          this.draw();
        });

        // 也监听 total-updated（用于示例）
        this.addEventListener('total-updated', (ev) => {
          // 将总和作为一个特殊点显示（演示 composed 事件如何穿过）
          const totalEntryIndex = this._dataset.findIndex(d => d.label === '__total__');
          if (totalEntryIndex >= 0) this._dataset[totalEntryIndex].value = ev.detail.total;
          else this._dataset.push({ label: '__total__', value: ev.detail.total });
          this.draw();
        });
      }

      draw() {
        const ctx = this.ctx;
        const cw = this.canvas.width;
        const ch = this.canvas.height;
        // 清空
        ctx.clearRect(0,0,cw,ch);
        // 背景网格
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,cw,ch);

        if (this._dataset.length === 0) {
          ctx.fillStyle = '#888';
          ctx.font = '14px sans-serif';
          ctx.fillText('等待数据...（从上层添加）', 10, ch/2);
          return;
        }

        // 计算最大值
        const max = Math.max(...this._dataset.map(d=>d.value), 1);
        const padding = 12;
        const barAreaW = cw - padding*2;
        const barW = Math.max(18, Math.floor(barAreaW / this._dataset.length) - 10);
        this._dataset.forEach((d, i) => {
          const x = padding + i * (barW + 10);
          const h = Math.round((d.value / max) * (ch - 40));
          const y = ch - 20 - h;

          // 条形
          ctx.fillStyle = '#0b7a88';
          ctx.fillRect(x, y, barW, h);
          // 值文本
          ctx.fillStyle = '#042';
          ctx.font = '12px sans-serif';
          ctx.fillText(String(d.value), x, y - 6);
          // 标签（换行、截断处理）
          ctx.save();
          ctx.translate(x + barW/2, ch - 6);
          ctx.rotate(0);
          const label = d.label === '__total__' ? '总和' : String(d.label);
          ctx.textAlign = 'center';
          ctx.fillStyle = '#0b5566';
          ctx.fillText(label.length > 12 ? label.slice(0,12) + '…' : label, 0, 0);
          ctx.restore();
        });
      }
    }
    customElements.define('layer-four', LayerFour);

    /* 全局提示：确保事件能穿越 shadow boundary 时需要 composed: true。上面的 dispatchEvent 使用了 composed:true。 */
  </script>
</body>
</html>
