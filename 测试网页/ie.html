<!doctype html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=EmulateIE7" />
    <title>IE 模式测试页面</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .ie-box {
        background-color: #f0f0f0;
        border: 2px solid #0066cc;
        padding: 15px;
        width: 300px;
        /* 下面这行是 IE 特有的 CSS 滤镜，现代浏览器不支持 */
        filter: progid:DXImageTransform.Microsoft.Shadow(Color=#999999, Strength=5, Direction=135);
      }
      marquee {
        display: block;
        color: #cc0000;
        font-size: 18px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>🧪 IE 模式兼容性测试</h1>

    <div class="ie-box">
      <p>✅ 这个盒子使用了 IE 特有的 <code>filter</code> 阴影效果。</p>
      <p>如果能看到阴影，说明 IE 模式生效了。</p>
    </div>

    <!-- 下面这个是 IE 特有的 <marquee> 跑马灯标签，现代浏览器不支持 -->
    <marquee>👉 这是一段跑马灯文字（仅 IE 模式可见） 👈</marquee>

    <hr />
    <p><strong>当前浏览器信息：</strong></p>
    <p id="browser-info"></p>

    <script>
      // 用 IE 特有的方式检测浏览器（ActiveX 对象）
      try {
        var isIE = new ActiveXObject('HTMLFile');
        document.getElementById('browser-info').innerHTML =
          '🟢 当前运行在 <strong>Internet Explorer 兼容模式</strong> 下（ActiveX 检测通过）';
      } catch (e) {
        document.getElementById('browser-info').innerHTML = '🔴 当前 <strong>不是</strong> IE 模式（ActiveX 检测失败）';
      }
    </script>
  </body>
</html>
